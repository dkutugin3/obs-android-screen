name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x64) build + tests
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ffmpeg
            zip
      - name: Configure and build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Offline tests
        run: |
          # Native exe + MSYS2 /tmp do not mix: keep streams in the workspace.
          # pacman's ffmpeg (GPL) has libx264/libx265; the bundled LGPL
          # ffmpeg does not.
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1080x2340:rate=60 -t 2 \
            -c:v libx264 -profile:v baseline -pix_fmt yuv420p -bsf:v h264_mp4toannexb \
            -f h264 ./test-stream.h264
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1080x2340:rate=60 -t 2 \
            -c:v libx265 -pix_fmt yuv420p -f hevc ./test-stream.h265
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=2340x1080:rate=60 -t 1 \
            -c:v libx264 -profile:v baseline -pix_fmt yuv420p -bsf:v h264_mp4toannexb \
            -f h264 ./test-stream-rot.h264
          ./build/obs-android-adb-tests.exe ./test-stream.h264 ./test-stream.h265 ./test-stream-rot.h264
      - name: Package
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: win-release
          path: release/*
          retention-days: 3

  release:
    name: Build and publish release (macOS + Windows)
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build (universal arm64 + x86_64)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build

      - name: Offline tests
        run: |
          brew install ffmpeg
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1080x2340:rate=60 -t 2 \
            -c:v libx264 -profile:v baseline -pix_fmt yuv420p -bsf:v h264_mp4toannexb \
            -f h264 /tmp/obs-android-adb-test.h264
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1080x2340:rate=60 -t 2 \
            -c:v libx265 -pix_fmt yuv420p -f hevc /tmp/obs-android-adb-test.h265
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=2340x1080:rate=60 -t 1 \
            -c:v libx264 -profile:v baseline -pix_fmt yuv420p -bsf:v h264_mp4toannexb \
            -f h264 /tmp/obs-android-adb-test-rot.h264
          ./build/obs-android-adb-tests

      - name: Package
        run: ./scripts/package-release.sh

      - uses: actions/download-artifact@v4
        with:
          name: win-release
          path: release/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "obs-android-adb ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes-file - <<'EOF'
          Android Screen (ADB) source for OBS Studio — macOS (universal:
          Apple Silicon + Intel).

          **Install:** open the `.dmg`, quit OBS, copy
          `obs-android-adb.plugin` to
          `~/Library/Application Support/obs-studio/plugins/` (step-by-step
          `INSTALL.txt` inside). Requires OBS 30+ — **adb is bundled**, no
          other dependencies. Full instructions in the README.
          EOF
